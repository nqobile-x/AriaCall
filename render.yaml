services:
  - type: web
    name: aria-support
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: OBSIDIAN_VAULT
        value: obsidian-vault
    disk:
      name: aria-models
      mountPath: /opt/render/project/src/voice
      sizeGB: 2
